# 磐石 Panshi —— Nginx TLS 反向代理示例
# 用途：在应用容器外做 HTTPS 终结 + WebSocket 透传（SignalR /hubs）。
# 应用容器本身只跑 http（EXPOSE 8080，主机映射 18080），不直接暴露公网。
#
# 启用后请同步设置应用环境变量：
#   Features__TrustForwardedHeaders=true   # 让后端读取 X-Forwarded-For/Proto（真实 IP 与 https 协议）
# 并把 .env 里的 PANSHI_JWT_SECRET / PANSHI_DB_PASSWORD 换成生产值。
#
# 放置：/etc/nginx/conf.d/panshi.conf，改完 nginx -t && systemctl reload nginx

# 1) HTTP → HTTPS 强制跳转
server {
    listen 80;
    listen [::]:80;
    server_name panshi.example.com;          # ← 改成你的域名
    return 301 https://$host$request_uri;
}

# 2) HTTPS 终结 + 反代到应用
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panshi.example.com;          # ← 改成你的域名

    # 证书（Let's Encrypt 示例）
    ssl_certificate     /etc/letsencrypt/live/panshi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panshi.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # HSTS（确认全站 HTTPS 稳定后再启用更长时间；先给 6 个月观察）
    add_header Strict-Transport-Security "max-age=15768000" always;

    # 上传文件大小上限（与后端 File 上传限制保持一致或略大）
    client_max_body_size 50m;

    # 通用转发头：后端开 TrustForwardedHeaders 后据此还原真实来源
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SignalR / WebSocket（/hubs）：必须 1.1 + Upgrade 透传 + 拉长读超时
    location /hubs/ {
        proxy_pass         http://127.0.0.1:18080;   # 同机；跨容器改成 http://panshi-api:8080
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $http_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # Hangfire 面板（可选，建议加 IP 白名单或 Basic Auth 再暴露）
    location /hangfire {
        proxy_pass         http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        # allow 10.0.0.0/8; deny all;   # ← 生产建议限内网
    }

    # 其余（前端 SPA + /api）全部转给应用
    location / {
        proxy_pass         http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }
}
